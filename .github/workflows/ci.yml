name: CI

# Triggered by `pull_request` only. A fork's pull request must run with the fork's permissions and
# no access to this repository's secrets, so the base-repository-privileged trigger is banned here -
# it is the standard way secrets leak out of a public repository through a fork. A guard greps
# `.github/` for that trigger's name, so it is not written out anywhere, not even in a comment.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The components of this project arrive over the course of it, so a job whose component is not in
  # the tree yet must not run - and must not fail either. This job reports which components exist,
  # and each component job is gated on it, so a job with nothing to build is SKIPPED.
  #
  # A skipped job satisfies a required status check, while a failing one does not - not even when
  # the job is flagged to fail without failing the run, which keeps the workflow run green but
  # still publishes a check run whose conclusion is `failure`, and branch protection reads the
  # check run. So every check name below can be a required check from today: it is
  # green while its component is absent, and it starts doing real work by itself the moment the
  # component lands. Nothing has to be remembered, and nothing is permanently red.
  #
  # `detect` needs the checkout: a job-level `if` is evaluated before any workspace exists, so
  # hashFiles() in one would see an empty directory and the job would skip forever.
  detect:
    name: detect
    runs-on: ubuntu-latest
    outputs:
      bridge: ${{ steps.probe.outputs.bridge }}
      android: ${{ steps.probe.outputs.android }}
      mac: ${{ steps.probe.outputs.mac }}
    steps:
      - uses: actions/checkout@v7
      - id: probe
        run: |
          {
            echo "bridge=$([ -f bridge/go.mod ] && echo true || echo false)"
            echo "android=$([ -f gradlew ] && echo true || echo false)"
            echo "mac=$([ -f mac/Package.swift ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

  # Not gated on anything. The guard scripts and their self-tests are already in the tree, and this
  # is the one job that must be able to fail from the first run.
  guards:
    name: guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/tests/guards_test.sh
      - run: ./scripts/check-no-tokens.sh
      - run: ./scripts/check-no-credentials.sh
      - run: ./scripts/check-no-private-keys.sh
      - run: ./scripts/check-no-addresses.sh
      - run: ./scripts/check-constant-time-tokens.sh
      - run: ./scripts/check-no-cyrillic.sh

  bridge:
    name: bridge
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.bridge == 'true'
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          # The module has zero third-party dependencies, so there is no go.sum to key a cache on
          # and setup-go fails outright when it cannot resolve cache-dependency-path.
          cache: false
      - name: Refuse any third-party dependency
        run: |
          if grep -q '^require' go.mod; then echo "third-party dependency added"; exit 1; fi
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      # -race, and it is not optional. Almost everything this bridge has been careful about is
      # concurrent - the trust store's mutex, the identity mint that coordinates two starts through
      # a hard link, the watchdog goroutine that outlives the call that made it - and none of it was
      # verified here for the first several tasks, because the flag was missing and a green run
      # looks identical either way. The suite must not be split into raced and unraced halves to
      # save time: the package left out is exactly where the next race will live.
      - run: go test ./... -race
      # `wire/` is a contract two implementations in two languages are held to, and the generator
      # that produces it sits behind the `vectors` build tag, so the ordinary suite never compiles
      # it. It stopped compiling for five commits and every run in between was green, because a file
      # nothing builds cannot fail. Regenerating it here means the tag is exercised on every push and
      # the vectors are provably still derivable from the encoder that has to agree with them; a
      # generator nobody can run is a contract nobody can re-derive.
      #
      # The diff is the assertion. If the encoder has moved, the regenerated files differ and this
      # fails - which is the drift the vectors exist to catch, arriving here rather than in the
      # Kotlin suite weeks later. Fixing it means deciding which side is wrong, never re-running the
      # generator to make the red go green.
      #
      # `-count=1` is load-bearing. Without it the Go test cache answers `ok (cached)`, the generator
      # never executes, and the diff below then compares a tampered wire/ against itself and passes.
      # Reproduced both ways: warm, a hand-edited vector sailed through; with -count=1 it fails. The
      # cache is cold on this runner today only because setup-go happens to have `cache: false` for
      # an unrelated reason, so one line of caching added elsewhere would have turned this step green
      # and blind with nothing in the diff to say so.
      #
      # And the generator is asserted to have RUN. `go test -run` prints `ok [no tests to run]` and
      # exits 0 when its pattern matches nothing, so renaming either function would retire this check
      # silently - a check that cannot fail, guarding a contract, reporting the word that means fine.
      - name: Re-derive the wire vectors
        run: |
          set -euo pipefail
          go test ./internal/enroll/ -tags vectors -count=1 -v -run 'TestWrite.*Vectors' \
            | tee /tmp/vectors.log
          for name in TestWriteVectors TestWriteRejectVectors; do
            if ! grep -q "^--- PASS: $name " /tmp/vectors.log; then
              echo "::error::$name did not run, so wire/ was not re-derived."
              echo "    A -run pattern that matches nothing exits 0. If the generator was renamed,"
              echo "    rename it here too; if it was deleted, this whole step goes with it."
              exit 1
            fi
          done
      - name: Refuse vectors the generator does not reproduce
        working-directory: ${{ github.workspace }}
        run: |
          if ! git diff --quiet -- wire/; then
            echo "::error::wire/ is not what the generator produces from the current encoder."
            git diff --stat -- wire/
            git diff -- wire/
            exit 1
          fi
          echo "OK: wire/ is reproducible from the generator."

  android:
    name: android
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.android == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew assembleDebug testDebugUnitTest lintDebug assembleDebugAndroidTest

  mac:
    name: mac
    runs-on: macos-latest
    needs: detect
    if: needs.detect.outputs.mac == 'true'
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v7
      # The bundle carries the Go bridge, so this job builds the Go half too. Pinned rather than
      # taken from whatever the runner image happens to ship, for the same reason the bridge job
      # pins it: a toolchain that moves under us changes the artefact without changing the diff.
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: false
      - run: swift build
      - run: swift test
      # **The bundle is built here, on every pull request, and not merely by whoever remembers.**
      #
      # Everything below this line is about an artefact rather than about source, and no guard in
      # `scripts/` can see any of it: those read tracked text, and this is 19 MB of Mach-O that never
      # enters the repository. If it is not asserted on the runner it is asserted nowhere.
      - name: Assemble the bundle
        run: ./scripts/bundle.sh
      # Both architectures. `bundle.sh` refuses to sign a thin bridge itself; this repeats it here so
      # a change that removed the check inside the script does not also remove the check on it.
      - name: The bridge is universal
        run: |
          set -euo pipefail
          app="$(swift build -c release --show-bin-path)/AgtermRemote.app"
          archs="$(lipo -archs "$app/Contents/Resources/agterm-remote-bridge")"
          echo "archs: $archs"
          for want in x86_64 arm64; do
            case " $archs " in
              *" $want "*) ;;
              *) echo "::error::the bundled bridge is '$archs' and needs $want"; exit 1 ;;
            esac
          done
      # **The build machine's home directory, searched for in the bytes that would ship.**
      #
      # `-trimpath` is the flag that keeps it out, and a flag is a thing somebody removes while
      # debugging and forgets to put back. On this runner the leaked path would be the hosted work
      # directory and nobody's private business, which is exactly what would let the omission survive
      # review here and ship from somebody's laptop later. The assertion is here so it does not.
      #
      # Note the guard that guards the guard: `check-no-addresses.sh` refuses a committed
      # `/Users/<name>` in tracked text, so this comment cannot spell the example out. That is the
      # rule working, not an inconvenience.
      - name: The bridge carries no build-machine paths
        run: |
          set -euo pipefail
          app="$(swift build -c release --show-bin-path)/AgtermRemote.app"
          bridge="$app/Contents/Resources/agterm-remote-bridge"
          if LC_ALL=C grep -aq '/Users/' "$bridge"; then
            echo "::error::the bundled bridge names the build machine — is -trimpath still there?"
            LC_ALL=C grep -ao '/Users/[^\"]\{0,60\}' "$bridge" | sort -u | head -5
            exit 1
          fi
          echo "OK: no build-machine paths in the shipped bridge."
      # It has to RUN, on the runner, out of the bundle. A universal binary with no build paths that
      # cannot execute is three green checks over an app whose Start does nothing.
      - name: The bundled bridge runs
        run: |
          set -euo pipefail
          app="$(swift build -c release --show-bin-path)/AgtermRemote.app"
          "$app/Contents/Resources/agterm-remote-bridge" --help

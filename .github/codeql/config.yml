name: agterm-remote

# One exclusion, and it is narrower than it looks.
#
# `scripts/tls-proxy` is a stand-in for a router that publishes a Mac by proxying it, used by
# `scripts/enrol-end-to-end.sh --proxied`. It opens a TLS connection to the bridge with
# `InsecureSkipVerify`, which CodeQL flags as `go/disabled-certificate-check` — correctly, and it is
# exactly what this program has to do. **A router that proxies to a Mac on its LAN validates nothing
# either**: there is no name it could check the bridge's certificate against, which is the whole
# reason the on-link hop is described in `main.go` as opportunistic and as authenticating nobody. A
# stand-in that validated would be testing something the real thing does not do.
#
# What is given up, stated plainly: about a hundred lines of test harness are not scanned. Nothing
# under this path ships — it is not in the app bundle, not in the bridge module, and not built by
# any job in `ci.yml`. The alternative considered and rejected was dismissing the alert in the web
# UI, which is not reproducible from the repository and leaves nothing here saying why.
#
# **This is not a place to add paths.** An exclusion that grows is an exclusion nobody reads.
paths-ignore:
  - scripts/tls-proxy

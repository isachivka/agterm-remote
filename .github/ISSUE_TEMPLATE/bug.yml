name: Bug report
description: Something behaves differently from how it is documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security problems here. Use a
        [private security advisory](https://github.com/isachivka/agterm-remote/security/advisories/new)
        instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
      placeholder: |
        1. ...
        2. ...
        Expected: ...
        Got: ...
    validations:
      required: true

  - type: input
    id: agterm-version
    attributes:
      label: agterm version
      description: The version of agterm itself, not of this project.
      placeholder: "e.g. 0.9.2"
    validations:
      required: true

  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: "e.g. 15.5 (Apple silicon)"
    validations:
      required: true

  - type: input
    id: android-version
    attributes:
      label: Android version and device
      placeholder: "e.g. Android 15, Pixel 8"
    validations:
      required: true

  - type: textarea
    id: menu-bar
    attributes:
      label: What the menu-bar icon said
      description: >-
        Open the Mac app's menu-bar item and copy what it reports — the bridge status line and
        anything else it shows at the moment the problem happens.
    validations:
      required: true

  - type: input
    id: app-versions
    attributes:
      label: Versions of this project
      description: The Mac app and the Android app, if you know them.
      placeholder: "e.g. mac 0.1.0, android 0.1.0"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >-
        Anything relevant from the bridge log or logcat. Scrub addresses, hostnames and tokens
        before pasting — this is a public issue.
      render: text
    validations:
      required: false

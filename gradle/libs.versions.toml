[versions]
# Toolchain versions are pinned deliberately. See the README for the pinned set.
agp = "9.3.1"
# Kotlin is not chosen independently: AGP 9.3.1 ships built-in Kotlin at 2.2.10, and the
# Compose compiler plugin must match the Kotlin version in use.
kotlin = "2.2.10"
coreKtx = "1.19.0"
lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"
composeBom = "2026.06.01"
junit = "4.13.2"
androidxTestJunit = "1.3.0"
# Pinned forward deliberately: Compose ui-test-junit4 drags in espresso-core 3.5.0 and
# androidx.test:runner 1.5.0 transitively, and those predate API 37 - espresso 3.5.0 reflects on
# InputManager.getInstance(), which Android 17 removed, so instrumentation tests crash on boot.
androidxTestRunner = "1.7.0"
espresso = "3.7.0"
# The token's ciphertext lives in a DataStore preference. Latest stable on Google Maven, checked
# against the group's maven-metadata rather than taken from memory.
datastore = "1.2.1"
# The only HTTP client this app has. Latest stable on Maven Central, checked against the artifact's
# maven-metadata. mockwebserver3 ships from the same version and stays test-only.
okhttp = "5.4.0"
# Test-only. org.json is in the Android platform and costs the .apk nothing, but the android.jar
# that unit tests compile against is stubs that throw, so the JVM tests need a real implementation.
# The device test parses the same fixture against the platform's own copy.
json = "20260719"
# REQ-0009 iteration 1, and the whole dependency cost of pairing: one artifact.
#
# Decode only, pure Java, no Android wrapper, no Play Services, no network. Its POM declares one
# dependency and that one is test-scoped, so the runtime transitive count is zero - verified with a
# parser first validated against artifacts known to HAVE dependencies (okhttp -> 2,
# datastore-preferences -> 5), because a zero from an unvalidated parser is indistinguishable from a
# query that returned nothing.
#
# zxing also drives the LIVE path and buys nothing to do it: PlanarYUVLuminanceSource takes a camera
# frame's Y plane directly, so the decoder is the same one the file route has always used. The camera
# is what REQ-0019 buys; the decoder was already paid for.
zxing = "3.5.4"

# The note that used to sit above rejected CameraX at "+17 without camera-view, +39 with it". Those
# were GROSS counts - they included Compose, kotlin-stdlib and androidx.core, all of which this app
# already ships - and the decision should never have been taken on them. Re-measured 2026-08-09
# against the app's real releaseRuntimeClasspath of 128 artifacts:
#
#   CameraX + camera-compose   21 new,  4.71 MB   <- taken
#   CameraX + camera-view      37 new, 10.50 MB      Guava 2.92 MB and AppCompat 1.07 MB inside it
#   ML Kit, model bundled      22 new, 12.47 MB      unbought; a named escalation in REQ-0019
#
# camera-compose is 5 artifacts and 0.41 MB more than bare CameraX and supplies CameraXViewfinder,
# which owns the SurfaceRequest lifecycle - so there is no AndroidView, no hand-rolled SurfaceProvider
# and no rotation or teardown code of ours to get wrong. Verified by listing the classes inside the
# downloaded .aar rather than by reading a documentation page.
camerax = "1.6.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
androidx-camera-compose = { group = "androidx.camera", name = "camera-compose", version.ref = "camerax" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver3-junit4", version.ref = "okhttp" }
# Test-only, same version as the client. Mints expired, wrong-hostname and untrusted certificates
# in-process, so the four TLS states are proven against real handshakes instead of against a reading
# of the OkHttp source - with no network and no third-party host such as badssl.com to be flaky.
okhttp-tls = { group = "com.squareup.okhttp3", name = "okhttp-tls", version.ref = "okhttp" }
json = { group = "org.json", name = "json", version.ref = "json" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
